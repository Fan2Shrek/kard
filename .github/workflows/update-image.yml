name: Update image

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

env:
  COMPOSE: docker compose
  REGISTRY: ghcr.io/fan2shrek/kard

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name == 'master' && 'latest' || 'dev' }}
      BUILD_TARGET: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.REGISTRY }}" | docker login ghcr.io -u Fan2Shrek --password-stdin

      - name: Build image
        run: BUILD_TARGET=prod ${COMPOSE} build php

      - name: Push image
        run: ${COMPOSE} push php

  build-bot:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name == 'master' && 'latest' || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for bot changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            bot:
              - 'python/**'

      - name: Login to GitHub Container Registry
        if: steps.filter.outputs.bot == 'true' || github.event_name == 'workflow_dispatch'
        run: echo "${{ secrets.REGISTRY }}" | docker login ghcr.io -u Fan2Shrek --password-stdin

      - name: Build image
        if: steps.filter.outputs.bot == 'true' || github.event_name == 'workflow_dispatch'
        run: ${COMPOSE} build bot

      - name: Push image
        if: steps.filter.outputs.bot == 'true' || github.event_name == 'workflow_dispatch'
        run: ${COMPOSE} push bot
